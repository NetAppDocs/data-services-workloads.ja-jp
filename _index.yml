  title: NetApp Workload Factoryのドキュメント
  summary: NetApp Workload Factoryの使用を開始して、クラウドストレージワークロードを最大限に活用しましょう。セットアップが完了すると、ワークロード用のストレージシステムの作成、最適化、管理、コスト削減の検討、組み込みのInfrastructure-as-Codeコパイロットを使用したプラットフォーム間の自動化、およびWorkload
    Factoryでのワークロードの管理を行うことができます。
  keywords: Workload Factory, fsx, account, credentials, users, permissions, log in,
    calculator, codebox
